name: Bootstrap Android Platform

# One-time (or on-demand) job: generates android/ via the real Capacitor
# CLI and merges in WTFMF's custom native plugin + ADR-012 SDK settings,
# then commits the result back to the repository.
#
# Run this manually once via Actions → "Bootstrap Android Platform" →
# Run workflow. After android/ is committed, android-build.yml handles
# every regular build from then on.
#
# This step needs real network access to fetch the Gradle wrapper and
# Android dependencies — it was intentionally NOT hand-generated in the
# original scaffold, which was authored offline.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if android/ already exists
        run: |
          if [ -d "android" ]; then
            echo "::error::android/ already exists. Delete it first if you really want to regenerate from scratch."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run bootstrap script
        run: bash scripts/bootstrap-android.sh

      - name: Commit generated android/ project
        run: |
          git config user.name "wtfmf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add android/
          git commit -m "chore: bootstrap android/ via Capacitor CLI (ADR-012)" || echo "Nothing to commit"
          git push
